# HTTP → HTTPS редирект для обоих доменов
server {
    listen 80;
    server_name lozo.students.nomorepartiessite.ru api.lozo.students.nomorepartiessite.ru;
    return 301 https://$host$request_uri;
}

# HTTPS — основной сервер (фронтенд)
server {
    listen 443 ssl;
    http2 on;
    server_name lozo.students.nomorepartiessite.ru;

    ssl_certificate /etc/letsencrypt/live/lozo.students.nomorepartiessite.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lozo.students.nomorepartiessite.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    # SPA-роутинг
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Статика
    location /content/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

