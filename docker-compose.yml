services:
  # ============================================
  # PostgreSQL — база данных
  # ============================================
  database:
    image: postgres:16-alpine
    container_name: film-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/test/docker-init:/docker-entrypoint-initdb.d
    networks:
      - film-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # pgAdmin — админка для БД
  # ============================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: film-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - film-network
    depends_on:
      - database

  # ============================================
  # Backend — Nest.js API
  # ============================================
  backend:
    image: ghcr.io/sergeylozin/film-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: film-backend
    restart: unless-stopped
    environment:
      DATABASE_DRIVER: ${DATABASE_DRIVER}
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      PORT: ${BACKEND_PORT}
      LOGGER_TYPE: ${LOGGER_TYPE}
      DEBUG: ${DEBUG}
    ports:
      - "${BACKEND_PORT}:3001"
    volumes:
      - ./backend/public:/app/public
    networks:
      - film-network
    depends_on:
      database:
        condition: service_healthy

  # ============================================
  # Frontend — сборка статики (для volume)
  # ============================================
  frontend:
    image: ghcr.io/sergeylozin/film-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: film-frontend
    restart: unless-stopped
    volumes:
      - frontend_dist:/app/dist
    networks:
      - film-network

  # ============================================
  # Nginx — раздача фронта + прокси на API
  # ============================================
  nginx:
    image: ghcr.io/sergeylozin/film-nginx:latest
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: film-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
    networks:
      - film-network
    depends_on:
      - backend
      - frontend

# ============================================
# Volumes — постоянные данные
# ============================================
volumes:
  postgres_data:
  pgadmin_data:
  frontend_dist:

# ============================================
# Networks — общая сеть
# ============================================
networks:
  film-network:
    driver: bridge